<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.B. Tiling – Customer & Job Management Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0EA;--stone:#EAE5DC;--white:#FCFBF8;--ink:#161616;--ink2:#3D3B38;--mute:#77726A;--line:#DCD5CA;--line2:#E8E3DA;
  --accent:#A24F2A;--accent2:#843F20;--accent-soft:#F3E4DA;
  --teal:#161616;--teal2:#000;--teal-soft:#ECE7DF;--clay:#A24F2A;--clay-soft:#F3E4DA;
  --ok:#2D6A45;--ok-soft:#E3F0E7;--warn:#8F5B00;--warn-soft:#F8EDD5;--bad:#A3372F;--bad-soft:#F6E1DE;--info:#2B5A8C;--info-soft:#E3ECF6;
  --r:6px;--shadow:0 1px 2px rgba(22,22,22,.04);
  --display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:var(--display);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.6 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{margin:0;line-height:1.1;font-family:var(--display);letter-spacing:-.02em}
.serif{font-family:var(--display)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* ---------- prototype bar ---------- */
.protobar{background:#0E0E0E;color:#B9B3AA;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:7px 20px;font-size:12px}
.protobar .note{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.protobar .note b{color:#fff;font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff26;padding:2px 9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#D8D2C9}
.chip.live{border-color:#4E8F67;color:#B9E3C8}.chip.mock{border-color:#9C7432;color:#F0D7A8}
.seg{display:inline-flex;border:1px solid #ffffff2e;padding:2px}
.seg button{background:transparent;border:0;color:#B9B3AA;padding:5px 14px;font-size:12.5px;font-weight:600}
.seg button.on{background:#fff;color:var(--ink)}
@media(max-width:760px){.protobar .chip{display:none}}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--ink);border-radius:2px;padding:11px 18px;font-weight:600;font-size:14px;background:var(--ink);color:#fff;transition:background .15s,color .15s,border-color .15s}
.btn .ic{transition:transform .2s}
.btn:hover{background:#000}.btn:hover .ic{transform:translateX(3px)}
.btn.accent,.btn.clay{background:var(--accent);border-color:var(--accent)}.btn.accent:hover,.btn.clay:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.line,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.line:hover,.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.light{background:transparent;color:#fff;border-color:#ffffff66}.btn.light:hover{background:#fff;color:var(--ink)}
.btn.plain{background:transparent;color:var(--ink2);border-color:transparent}.btn.plain:hover{background:#0000000a}
.btn.danger{background:transparent;color:var(--bad);border-color:#DDB9B4}.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.lg{padding:15px 24px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.l{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 7px}
.field{margin-bottom:18px}
.in{position:relative}
.in .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute);width:16px;height:16px}
.in input{padding-left:38px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:12px 14px;border:1px solid #CFC8BC;border-radius:2px;background:var(--white);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#A9A195}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px #16161614}
textarea{min-height:120px;resize:vertical}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;display:flex;gap:6px;align-items:center}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px}
.invalid input,.invalid select,.invalid textarea{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.New{background:var(--info-soft);color:var(--info)}
.pill.Draft{background:#E9E5DE;color:#4C4A46}
.pill.Waiting,.pill.Quoted{background:var(--warn-soft);color:var(--warn)}
.pill.Accepted,.pill.Paid,.pill.Done{background:var(--ok-soft);color:var(--ok)}
.pill.Declined,.pill.Overdue{background:var(--bad-soft);color:var(--bad)}
.pill.Scheduled,.pill.Outstanding{background:var(--info-soft);color:var(--info)}
.pill.Planned{background:#E9E5DE;color:#4C4A46}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border:1px solid #D6B27A;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:2px;vertical-align:middle}
.wm,.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:none;border:0;padding:0}
.wm .tm,.brand .mark{width:20px;height:20px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:0;background:none;border-radius:0}
.wm .tm i,.brand .mark i{background:var(--ink);border-radius:0;opacity:1}
.wm .tm i:nth-child(4),.brand .mark i:nth-child(4){background:var(--accent)}
.wm.light{color:#fff}.wm.light .tm i{background:#fff}.wm.light .tm i:nth-child(4){background:var(--accent)}

/* =================== CUSTOMER SITE =================== */
.container{max-width:1240px;margin:0 auto;padding:0 36px}
@media(max-width:640px){.container{padding:0 20px}}
section[id]{scroll-margin-top:72px}
.snav{position:sticky;top:0;z-index:40;background:rgba(243,240,234,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.snav .container{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.slinks{display:flex;align-items:center;gap:26px}
.lk{background:none;border:0;padding:6px 0;font-size:14px;font-weight:500;color:var(--ink2);position:relative}
.lk::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--ink);transition:right .2s}
.lk:hover{color:var(--ink)}.lk:hover::after{right:0}
@media(max-width:940px){.slinks .lk{display:none}}

.surf{position:relative;width:100%;height:100%;min-height:120px;overflow:hidden}
.phl{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(22,22,22,.78);color:#F3F0EA;padding:5px 8px}

.hero2{border-bottom:1px solid var(--line)}
.hero2 .container{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.hero2 .copy{grid-column:1/8;padding:84px 0 72px;display:flex;flex-direction:column;justify-content:center}
.hero2 h1{font-weight:600;font-size:clamp(40px,5.2vw,78px);line-height:.96;letter-spacing:-.045em;margin:26px 0 28px;max-width:760px}
.hero2 h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:18px;line-height:1.6;color:var(--ink2);max-width:520px;margin:0}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.hero2 .visual{grid-column:8/13;position:relative;margin-right:-36px;min-height:600px;border-left:1px solid var(--line)}
.hero2 .visual .surf{position:absolute;inset:0}
.vcard{position:absolute;left:-56px;bottom:56px;background:var(--white);border:1px solid var(--line);padding:18px 20px;max-width:270px;box-shadow:0 18px 40px rgba(22,22,22,.1)}
.vcard b{display:block;font-family:var(--display);font-size:18px;letter-spacing:-.01em;margin:6px 0 2px}
.vcard span{font-size:13.5px;color:var(--mute)}
.principles{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.principles>div{padding:26px 28px 30px 0;border-right:1px solid var(--line)}
.principles>div+div{padding-left:28px}
.principles>div:last-child{border-right:0}
.principles b{display:block;font-family:var(--display);font-size:17px;margin:10px 0 4px;letter-spacing:-.01em}
.principles p{margin:0;color:var(--mute);font-size:14px}
@media(max-width:900px){
  .hero2 .copy,.hero2 .visual{grid-column:1/-1}
  .hero2 .copy{padding:52px 0 40px}
  .hero2 .visual{min-height:380px;margin:0 -20px;border-left:0}
  .vcard{left:20px;bottom:20px}
  .principles{grid-template-columns:1fr}
  .principles>div,.principles>div+div{padding:20px 0;border-right:0;border-bottom:1px solid var(--line)}
  .principles>div:last-child{border-bottom:0}
}

.sec2{padding:120px 0;border-bottom:1px solid var(--line)}
.sec2.stone{background:var(--stone)}
.shead{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;margin-bottom:60px}
.shead>.mono{grid-column:1/4;padding-top:12px}
.shead .t{grid-column:4/13}
.shead h2{font-weight:600;font-size:clamp(32px,4.2vw,58px);line-height:1.02;letter-spacing:-.04em;margin:0 0 18px;max-width:840px}
.shead p{color:var(--ink2);font-size:17px;max-width:580px;margin:0}
@media(max-width:900px){.sec2{padding:76px 0}.shead{grid-template-columns:1fr;margin-bottom:40px}.shead>.mono,.shead .t{grid-column:auto}.shead>.mono{padding:0 0 14px}}

.svcs{border-top:1px solid var(--ink)}
.svcrow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:30px 0;transition:background .2s}
.svcrow .no{grid-column:1/4}
.svcrow h3{grid-column:4/8;font-size:clamp(22px,2.3vw,30px);font-weight:500;letter-spacing:-.025em;transition:transform .25s}
.svcrow p{grid-column:8/12;margin:0;color:var(--ink2);font-size:15px}
.svcrow .go{grid-column:12/13;justify-self:end;width:46px;height:46px;border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.svcrow:hover h3{transform:translateX(8px)}
.svcrow:hover .go{background:var(--ink);border-color:var(--ink);color:#fff}
@media(max-width:900px){.svcrow{grid-template-columns:1fr auto;row-gap:8px;padding:24px 0}.svcrow .no{grid-column:1/-1}.svcrow h3{grid-column:1/2}.svcrow p{grid-column:1/2;grid-row:3}.svcrow .go{grid-column:2/3;grid-row:2/4}}

.proj{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:stretch}
.proj .feat{grid-column:1/8;aspect-ratio:5/4;position:relative}
.proj .feat .surf{position:absolute;inset:0}
.specs{grid-column:9/13;display:flex;flex-direction:column;justify-content:flex-end}
.specs h3{font-size:34px;font-weight:600;letter-spacing:-.035em;margin:10px 0 24px}
.specs dl{margin:0 0 28px;border-top:1px solid var(--ink)}
.specs dl div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.specs dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.specs dd{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.pgrid figure{margin:0}
.pgrid .frame{aspect-ratio:4/5;position:relative}
.pgrid .frame .surf{position:absolute;inset:0}
.pgrid figcaption{padding-top:14px;border-top:1px solid var(--ink);margin-top:14px}
.pgrid figcaption b{display:block;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
@media(max-width:900px){.proj .feat,.specs{grid-column:1/-1}.specs{margin-top:28px}.pgrid{grid-template-columns:1fr}}

.dark{background:#141414;color:#ECE7DF;border-bottom-color:#141414}
.dark .mono{color:#948D83}
.dark .shead p{color:#B6AFA5}
.steps2{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #3A3835}
.st{padding:30px 26px 6px;border-right:1px solid #2C2A28}
.st:first-child{padding-left:0}.st:last-child{border-right:0}
.st .num{font-family:var(--display);font-size:72px;font-weight:500;letter-spacing:-.05em;line-height:1;color:var(--accent)}
.st h3{font-size:21px;font-weight:600;margin:26px 0 10px;color:#fff}
.st p{color:#ABA49A;font-size:14.5px;margin:0 0 18px}
.st .who{display:inline-block;border:1px solid #3A3835;padding:3px 8px}
@media(max-width:900px){.steps2{grid-template-columns:1fr}.st,.st:first-child{padding:26px 0;border-right:0;border-bottom:1px solid #2C2A28}}

.anat{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.anotes{grid-column:1/6}
.an{display:flex;gap:16px;padding:20px 0;border-top:1px solid #CFC8BC}
.an:last-child{border-bottom:1px solid #CFC8BC}
.an b{display:block;font-family:var(--display);font-size:17px;letter-spacing:-.01em;margin-bottom:3px}
.an p{margin:0;color:var(--ink2);font-size:14.5px}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;background:var(--accent);color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:600}
.doc{grid-column:7/13;background:var(--white);border:1px solid var(--line);padding:36px;box-shadow:0 30px 60px rgba(22,22,22,.10);position:relative}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.doc td{padding:11px 6px;border-bottom:1px solid var(--line2)}
.doc .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc .tot{margin-left:auto;max-width:280px;margin-top:16px;font-variant-numeric:tabular-nums}
.doc .tot div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;color:var(--ink2)}
.doc .tot .g{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;color:var(--ink);font-weight:700;font-size:18px}
.doc .mk{width:20px;height:20px;font-size:10.5px;margin-right:6px;vertical-align:middle}
.doc .ex{position:absolute;top:-12px;right:24px}
@media(max-width:900px){.anotes,.doc{grid-column:1/-1}.doc{margin-top:32px;padding:22px}}

.mats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
.mat{padding:26px 24px 8px;border-right:1px solid var(--line)}
.mat:first-child{padding-left:0}.mat:last-child{border-right:0;padding-right:0}
.mat .sw{height:150px;margin-bottom:20px}
.mat h3{font-size:22px;font-weight:600;margin:6px 0 8px}
.mat p{color:var(--ink2);font-size:14.5px;margin:0 0 16px}
.good{font-size:13.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}
.good .mono{display:block;margin-bottom:3px}
@media(max-width:900px){.mats{grid-template-columns:1fr 1fr}.mat,.mat:first-child,.mat:last-child{padding:22px 12px 8px 0;border-right:0}}
@media(max-width:560px){.mats{grid-template-columns:1fr}}

.faq{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
.faq .qs{grid-column:4/13;border-top:1px solid var(--ink)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pl{width:34px;height:34px;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .2s,background .2s}
.faq details[open] summary .pl{transform:rotate(45deg);background:var(--ink);color:#fff;border-color:var(--ink)}
.faq details p{margin:0 0 26px;color:var(--ink2);max-width:640px}
@media(max-width:900px){.faq .qs{grid-column:1/-1}.faq summary{font-size:17px}}

.cta2{background:#141414;color:#fff;padding:120px 0 104px;position:relative;overflow:hidden}
.cta2::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:120px 120px;pointer-events:none}
.cta2::after{content:"";position:absolute;right:120px;top:0;width:120px;height:120px;background:var(--accent)}
.cta2 .container{position:relative}
.cta2 .mono{color:#948D83}
.cta2 h2{font-weight:600;font-size:clamp(40px,6vw,84px);letter-spacing:-.045em;line-height:.98;margin:22px 0 8px;max-width:900px}
@media(max-width:700px){.cta2::after{width:56px;height:56px;right:20px}}
.sf2{background:#0E0E0E;color:#A39C92;padding:64px 0 28px;font-size:14px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1.6fr;gap:32px;padding-bottom:48px;border-bottom:1px solid #2A2826}
.fgrid p{margin:14px 0 0}
.fgrid .mono{color:#6F6960;margin-bottom:12px}
.fgrid button.fl{display:block;background:none;border:0;padding:4px 0;color:#D6D0C6;text-align:left}
.fgrid button.fl:hover{color:#fff}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px;color:#6F6960}
@media(max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}

/* quote page */
.qpage{padding:72px 0 120px;border-bottom:1px solid var(--line)}
.qgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.qaside{grid-column:1/5;position:sticky;top:100px}
.qaside h1{font-weight:600;font-size:clamp(36px,4.4vw,60px);line-height:1;letter-spacing:-.045em;margin:18px 0 18px}
.nextlist{list-style:none;margin:36px 0 0;padding:0;border-top:1px solid var(--ink)}
.nextlist li{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.nextlist b{display:block;font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.nextlist p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.qnote{display:flex;gap:10px;margin-top:24px;font-size:13.5px;color:var(--ink2);background:var(--stone);padding:14px 16px;border-left:3px solid var(--accent)}
.qnote .ic{margin-top:2px;color:var(--accent)}
.qform{grid-column:6/13}
@media(max-width:900px){.qaside .nextlist{display:none}.qpage{padding:44px 0 72px}.qaside,.qform{grid-column:1/-1;position:static}.qform{margin-top:36px}.nextlist{margin-top:24px}}
.fcard{background:var(--white);border:1px solid var(--line);padding:40px}
@media(max-width:640px){.fcard{padding:24px 20px}}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:36px}
.pg .bar{display:block;height:3px;background:var(--line);margin-bottom:10px}
.pg.cur .bar{background:var(--ink)}.pg.done .bar{background:var(--accent)}
.pg.cur .mono{color:var(--ink)}
@media(max-width:560px){.pg .mono{font-size:9.5px;letter-spacing:.04em}}

<script>
(function(){
"use strict";
const KEY="sbt_proto_v2";
let state={inq:[],quotes:[],seq:1};
let mem=null;

/* ---------- storage ---------- */
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){raw=mem;}
  if(raw){try{const s=JSON.parse(raw);if(s&&Array.isArray(s.inq)){state=s;return;}}catch(e){}}
  seed();
}
function save(){const s=JSON.stringify(state);mem=s;try{localStorage.setItem(KEY,s);}catch(e){}}
function seed(){
  const now=Date.now(),day=86400000;
  const items=[{d:"Supply & install wall tile (sq ft)",q:60,p:1800},{d:"Supply & install floor tile (sq ft)",q:25,p:1600},{d:"Demolition & disposal",q:1,p:35000}];
  state={seq:4,quotes:[{id:"Q-0001",inqId:"INQ-0001",status:"Waiting",taxRate:13,notes:"Sample quote. Pricing valid for 30 days.",items:items,versions:[{v:1,at:now-day*1.5,items:items,taxRate:13,notes:"Sample quote. Pricing valid for 30 days.",status:"Draft"},{v:2,at:now-day*1.2,items:items,taxRate:13,notes:"Sample quote. Pricing valid for 30 days.",status:"Waiting"}]}],
  inq:[
   {id:"INQ-0001",created:now-day*2,name:"Sample Customer A",phone:"(555) 010-0001",email:"sample.a@example.com",city:"Toronto",service:"Bathroom tiling",timeline:"1–3 months",desc:"Sample inquiry: replace shower wall tile and floor tile in a small bathroom.",contact:"Phone",photos:[],status:"Quoted"},
   {id:"INQ-0002",created:now-day,name:"Sample Customer B",phone:"",email:"sample.b@example.com",city:"Mississauga",service:"Kitchen backsplash",timeline:"As soon as possible",desc:"Sample inquiry: new backsplash, about 30 sq ft.",contact:"Email",photos:[],status:"New"},
   {id:"INQ-0003",created:now-day*0.3,name:"Sample Customer C",phone:"(555) 010-0003",email:"",city:"North York",service:"Floor tiling",timeline:"Flexible",desc:"Sample inquiry: entryway and hallway floor, roughly 90 sq ft.",contact:"Phone",photos:[],status:"New"}]};
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ic=(n,extra)=>`<svg class="ic ${extra||""}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const lineAmt=it=>Math.round((Number(it.q)||0)*(Number(it.p)||0));
function calc(items,rate){const sub=items.reduce((a,i)=>a+lineAmt(i),0);const tax=Math.round(sub*(Number(rate)||0)/100);return{sub,tax,total:sub+tax};}
const quoteFor=id=>state.quotes.find(q=>q.inqId===id)||null;
const getInq=id=>state.inq.find(i=>i.id===id)||null;
const statusOf=i=>{const q=quoteFor(i.id);return q?q.status:"New";};

/* ---------- placeholder surfaces (no stock photos: textured tile renders, clearly labelled) ---------- */
const SURF={
  marble:{base:"#E6E1D8",c:[.42,.38,.33],a:.55,f:"0.004 0.035",g:"rgba(252,251,248,.85)",w:170,h:340},
  concrete:{base:"#B7B2AA",c:[.22,.21,.19],a:.42,f:"0.75",g:"rgba(250,248,244,.45)",w:220,h:220},
  terracotta:{base:"#B36A47",c:[.38,.16,.07],a:.45,f:"0.35",g:"rgba(243,232,222,.85)",w:64,h:64},
  slate:{base:"#34342F",c:[.08,.08,.07],a:.6,f:"0.012 0.3",g:"rgba(255,255,255,.14)",w:180,h:90},
  zellige:{base:"#2D4F4B",c:[.85,.92,.88],a:.22,f:"0.05",g:"rgba(236,231,223,.9)",w:46,h:46},
  white:{base:"#EEEBE5",c:[.55,.53,.5],a:.22,f:"0.9",g:"rgba(160,154,145,.55)",w:70,h:140}
};
function surface(k){
  const s=SURF[k];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='${s.f}' numOctaves='4' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 ${s.c[0]} 0 0 0 0 ${s.c[1]} 0 0 0 0 ${s.c[2]} 0 0 0 ${s.a} 0'/></filter><rect width='360' height='360' filter='url(#n)'/></svg>`;
  const enc=encodeURIComponent(svg).replace(/'/g,"%27").replace(/\(/g,"%28").replace(/\)/g,"%29");
  return `background:linear-gradient(155deg,rgba(255,255,255,.20),rgba(255,255,255,0) 42%,rgba(0,0,0,.20)),linear-gradient(90deg,${s.g} 1.5px,transparent 1.5px) 0 0/${s.w}px ${s.h}px,linear-gradient(${s.g} 1.5px,transparent 1.5px) 0 0/${s.w}px ${s.h}px,url(data:image/svg+xml;utf8,${enc}) 0 0/360px 360px,${s.base}`;
}

  <div class="card"><h2><span class="l">${ic("file")}Invoices (sample)</span></h2><div class="scroll"><table class="tbl"><thead><tr><th>Invoice</th><th>Customer</th><th>Deposit</th><th>Balance</th><th>Status</th></tr></thead><tbody>
   <tr><td><b>INV-sample-1</b></td><td>Sample customer</td><td>$0.00</td><td>$0.00</td><td><span class="pill Outstanding">Outstanding</span></td></tr>
   <tr><td><b>INV-sample-2</b></td><td>Sample customer</td><td>$0.00</td><td>$0.00</td><td><span class="pill Paid">Paid</span></td></tr>
   <tr><td><b>INV-sample-3</b></td><td>Sample customer</td><td>$0.00</td><td>$0.00</td><td><span class="pill Overdue">Overdue</span></td></tr></tbody></table></div></div>`;
}
function renderReviews(){
  return head("Reviews","Customer feedback and website reviews",`<span class="tag">MOCKUP</span>`)+mockBar("Layout concept only. These are not real reviews. The owner would choose which reviews appear on the website.")+
  `<div class="two"><div class="card"><h2><span class="l">${ic("star")}Rating summary (sample)</span></h2><div style="display:flex;gap:16px;align-items:center"><div class="rate">–</div><div><div class="stars">★★★★★</div><div class="hint">No real ratings yet</div></div></div></div>
  <div class="card"><h2><span class="l">${ic("list")}Reviews (sample)</span></h2>
   <div class="rev"><div><b>Sample customer</b> <span class="stars">★★★★★</span><div class="hint">Placeholder text only</div></div><div style="display:flex;gap:8px;align-items:center"><span class="hint" style="margin:0">Show on website</span><span class="switch on"></span></div></div>
   <div class="rev"><div><b>Sample customer</b> <span class="stars">★★★★☆</span><div class="hint">Placeholder text only</div></div><div style="display:flex;gap:8px;align-items:center"><span class="hint" style="margin:0">Show on website</span><span class="switch"></span></div></div></div></div>`;
}

/* ---------- master render ---------- */
function render(){
  const pub=view==="site"||view==="quote";$("#seg-site").className=pub?"on":"";
  $("#seg-owner").className=pub?"":"on";
  let html;
  if(view==="site")html=renderSite();
  else if(view==="quote")html=renderQuotePage();
  else{
    const m={dashboard:renderDashboard,inquiries:renderInquiries,jobs:renderJobs,invoices:renderInvoices,reviews:renderReviews}[view];
    html=shell(m());
  }
  $("#root").innerHTML=html;
}

/* ---------- photos ---------- */
function shrink(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7));};img.onerror=()=>cb(null);img.src=fr.result;};
  fr.onerror=()=>cb(null);fr.readAsDataURL(file);
}

/* ---------- quote logic ---------- */
function newQuote(inqId){return{id:"Q-"+pad(state.quotes.length+1),inqId,status:"Draft",taxRate:13,notes:"",items:[{d:"",q:1,p:0}],versions:[]};}
function saveQuote(){
  const q=editor,err=$("#qerr");
  const items=q.items.filter(it=>it.d||it.p||Number(it.q)>1);
  if(!items.length){err.textContent="Add at least one line with a description and a price.";return;}
  for(const it of items){
    if(!it.d){err.textContent="Each line needs a description.";return;}
    if(!(Number(it.q)>0)){err.textContent="Quantity must be greater than 0.";return;}
    if(!(Number(it.p)>=0)){err.textContent="Price cannot be negative.";return;}
  }
  if(!(Number(q.taxRate)>=0)){err.textContent="Tax rate cannot be negative.";return;}
  err.textContent="";q.items=items;
  const ver=(q.versions.length?q.versions[q.versions.length-1].v:0)+1;
  q.versions.push({v:ver,at:Date.now(),items:JSON.parse(JSON.stringify(items)),taxRate:q.taxRate,notes:q.notes,status:q.status});
  const copy=JSON.parse(JSON.stringify(q)),idx=state.quotes.findIndex(x=>x.inqId===q.inqId);
  if(idx>=0)state.quotes[idx]=copy;else state.quotes.push(copy);
  save();editor=copy;render();toast(`Quote saved as v${ver}`);
}
function liveTotals(){const t=$("#totals");if(t)t.innerHTML=totalsHtml(calc(editor.items,editor.taxRate));}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const T=ev.target;
  const g=sel=>T.closest(sel);
  let el;
  if((el=g("[data-closemodal]"))&&(T===el||T.closest("[data-closebtn]"))){closeModal();return;}
  if((el=g("[data-closebtn]"))){closeModal();return;}
  if((el=g("[data-go]"))){setView(el.dataset.go);return;}
  if((el=g("[data-view]"))){setView(el.dataset.view);return;}
  if((el=g("[data-scroll]"))){const id="s-"+el.dataset.scroll,doit=()=>{const t=document.getElementById(id);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});};if(view!=="site"){view="site";try{location.hash="site";}catch(e){}render();setTimeout(doit,40);}else doit();return;}
  if((el=g("[data-pick]"))){formVals.service=el.dataset.pick;step=0;formErr={};setView("quote");return;}
  if((el=g("[data-svc]"))){captureForm();formVals.service=el.dataset.svc;formErr.service=null;render();return;}
  if((el=g("[data-rmphoto]"))){captureForm();photoBuf.splice(Number(el.dataset.rmphoto),1);render();return;}
  if((el=g("[data-zoom]"))){modal(`<img src="${photoBuf[Number(el.dataset.zoom)]}" alt="Photo preview">`,"img");return;}
  if((el=g("[data-ozoom]"))){const i=getInq(selInq);modal(`<img src="${i.photos[Number(el.dataset.ozoom)]}" alt="Customer photo">`,"img");return;}
  if((el=g("[data-open]"))){selInq=el.dataset.open;editor=null;showCopy=false;view="inquiries";try{location.hash="inquiries";}catch(e){}render();window.scrollTo(0,0);return;}
  if((el=g("[data-filter]"))){filter=el.dataset.filter;$("#chips").innerHTML=chipsHtml();$("#list").innerHTML=listHtml();return;}
  if((el=g("[data-del]"))){editor.items.splice(Number(el.dataset.del),1);if(!editor.items.length)editor.items.push({d:"",q:1,p:0});render();return;}
  if((el=g("[data-quick]"))){const last=editor.items[editor.items.length-1];const blank=last&&!last.d&&!last.p;if(blank)last.d=el.dataset.quick;else editor.items.push({d:el.dataset.quick,q:1,p:0});render();return;}
  if((el=g("[data-status]"))){editor.status=el.dataset.status;render();return;}
  if((el=g("[data-restore]"))){const n=el.dataset.restore;modal(`<h3>Restore v${n}?</h3><p>This replaces what is currently in the editor. Nothing is saved until you press Save quote.</p><div class="row"><button class="btn ghost" data-closebtn="1">Cancel</button><button class="btn" data-act="doRestore" data-v="${n}">Restore</button></div>`);return;}
  if((el=g("[data-act]"))){
    switch(el.dataset.act){
      case "next":captureForm();if(validateStep()){step++;}render();break;
      case "prev":captureForm();formErr={};step=Math.max(0,step-1);render();break;
      case "submit":captureForm();submitInquiry();break;
      case "newInq":done=null;render();break;
      case "back":selInq=null;editor=null;showCopy=false;render();break;
      case "newQuote":editor=newQuote(selInq);render();break;
      case "addLine":editor.items.push({d:"",q:1,p:0});render();break;
      case "saveQuote":saveQuote();break;
      case "toggleCopy":showCopy=!showCopy;render();break;
      case "askReset":modal(`<h3>Reset demo data?</h3><p>This removes every inquiry and quote in this browser and restores the three sample inquiries.</p><div class="row"><button class="btn ghost" data-closebtn="1">Cancel</button><button class="btn danger" data-act="doReset">Reset</button></div>`);break;
      case "doRestore":{const q0=quoteFor(selInq),v=q0.versions.find(x=>x.v===Number(el.dataset.v));editor.items=JSON.parse(JSON.stringify(v.items));editor.taxRate=v.taxRate;editor.notes=v.notes;editor.status=v.status;closeModal();render();toast(`Loaded v${v.v}. Save to keep it as a new version.`);break;}
      case "doReset":seed();save();closeModal();selInq=null;editor=null;render();toast("Demo data reset");break;
      case "copyText":{
        const i=getInq(selInq),txt=quoteText(i,editor),m=$("#copyMsg"),ta=$("#copyArea");
        const fb=()=>{ta.style.display="block";ta.select();m.textContent="Select and copy the text below.";};
        try{navigator.clipboard.writeText(txt).then(()=>toast("Quote copied"),fb);}catch(e){fb();}
        break;}
    }
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape")closeModal();
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="search"){query=el.value;$("#list").innerHTML=listHtml();return;}
  if(el.dataset&&el.dataset.qf&&editor){
    const n=Number(el.dataset.i),f=el.dataset.qf,it=editor.items[n];
    if(f==="d")it.d=el.value;else if(f==="q")it.q=el.value===""?"":Number(el.value);else it.p=Math.round((parseFloat(el.value)||0)*100);
    const ln=$("#line"+n);if(ln)ln.textContent=money(lineAmt(it));liveTotals();return;
  }
  if(el.id==="q-tax"&&editor){editor.taxRate=el.value===""?0:Number(el.value);liveTotals();return;}
  if(el.id==="q-notes"&&editor){editor.notes=el.value;return;}
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="f-photo"){
    captureForm();
    const files=Array.from(el.files||[]).slice(0,Math.max(0,3-photoBuf.length));if(!files.length)return;
    let left=files.length;
    files.forEach(f=>shrink(f,d=>{if(d)photoBuf.push(d);if(--left===0)render();}));
  }
});
window.addEventListener("hashchange",()=>{const before=view;fromHash();if(view!==before){selInq=null;editor=null;render();}});

load();fromHash();render();
})();
</script>
